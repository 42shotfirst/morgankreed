name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'code/site/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID      - IAM deploy user access key
#   AWS_SECRET_ACCESS_KEY  - IAM deploy user secret key
#   AWS_S3_BUCKET          - S3 bucket name (e.g., morgankreed-site-production)
#   AWS_CLOUDFRONT_DISTRIBUTION_ID - CloudFront distribution ID
#   AWS_REGION             - AWS region (e.g., us-east-1)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/site/package-lock.json

      - name: Install dependencies
        run: cd code/site && npm ci

      - name: Build
        run: cd code/site && npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync code/site/dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
