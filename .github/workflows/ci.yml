name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/site/package-lock.json

      - name: Install dependencies
        run: cd code/site && npm ci

      - name: Lint
        run: cd code/site && npm run lint

      - name: Typecheck
        run: cd code/site && npx tsc --noEmit

      - name: Build
        run: cd code/site && npm run build
