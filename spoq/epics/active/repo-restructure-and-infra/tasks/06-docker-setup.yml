description: |
  ## Objective
  Create a simple Docker setup for local production-like preview of the static site. This is not a complex multi-service setup like pinpoint, just a single container.

  ## Steps
  1. Create `infrastructure/docker/` directory
  2. Write `Dockerfile.site`:
     ```dockerfile
     # Stage 1: Build
     FROM node:20-alpine AS build
     WORKDIR /app
     COPY package.json package-lock.json ./
     RUN npm ci
     COPY . .
     RUN npm run build

     # Stage 2: Serve
     FROM nginx:alpine
     COPY --from=build /app/dist /usr/share/nginx/html
     COPY nginx.conf /etc/nginx/conf.d/default.conf
     EXPOSE 80
     ```
  3. Write `nginx.conf` for SPA routing:
     - try_files for static assets
     - Fallback to index.html for client-side routing
     - Gzip compression
     - Cache headers for static assets
  4. Write `docker-compose.yml`:
     - Service: site
     - Build context: ../../code/site
     - Port: 8080:80 (configurable)
  5. Write `.env.example` with PORT variable

  ## Verification
  ```bash
  docker compose -f infrastructure/docker/docker-compose.yml build
  ```
