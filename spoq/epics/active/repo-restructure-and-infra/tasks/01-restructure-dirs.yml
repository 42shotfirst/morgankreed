acceptance_criteria:
  - "[ ] code/site/ contains src/, public/, api/, index.html"
  - "[ ] code/site/ contains vite.config.ts, tailwind.config.js, postcss.config.js"
  - "[ ] code/site/ contains tsconfig.json, tsconfig.node.json, components.json, tempo.config.json"
  - "[ ] code/site/package.json retains all original dependencies and scripts"
