  - "[ ] .gitignore updated for new structure (node_modules in code/site/)"
  - "[ ] No source files remain at repository root level"

description: |
  ## Objective
  Move the React/Vite portfolio site from the repository root into `code/site/` to match the pinpoint monorepo layout pattern.

  ## Steps
  1. Create `code/site/` directory
  2. Move these directories: `src/`, `public/`, `api/`
  3. Move these files: `index.html`, `package.json`, `vite.config.ts`, `tailwind.config.js`, `postcss.config.js`, `tsconfig.json`, `tsconfig.node.json`, `components.json`, `tempo.config.json`, `package-lock.json`, `.htaccess`
  4. Create a new root `package.json` as workspace root:
     ```json
     {
       "name": "morgankreed",
       "private": true,
       "workspaces": ["code/site"]
     }
     ```
  5. Update `.gitignore` to account for new paths
  6. Do NOT move: `.claude/`, `.github/`, `spoq/`, `context/`, `documents/`, `infrastructure/`, `.gitignore`, `.mcp.json`

  ## Verification
  - `ls code/site/src/` shows component directories
  - Root directory is clean of site-specific configs
  - `cat package.json` shows workspace configuration
