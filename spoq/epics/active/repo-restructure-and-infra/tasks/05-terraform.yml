description: |
  ## Objective
  Create Terraform infrastructure-as-code for hosting the static portfolio site on AWS S3 + CloudFront. Keep it simple and production-ready.

  ## Steps
  1. Create `infrastructure/terraform/` directory structure:
     ```
     terraform/
     ├── main.tf            # Module composition
     ├── variables.tf       # Input variables
     ├── outputs.tf         # Outputs
     ├── provider.tf        # AWS provider (us-east-1 for CloudFront/ACM)
     ├── backend.tf         # S3 backend (commented out for initial setup)
     ├── versions.tf        # Required providers + versions
     ├── README.md
     └── modules/
         ├── s3-site/       # Static website bucket
         ├── cloudfront/    # CDN distribution
         ├── acm/           # SSL certificate
         └── iam-deploy/    # CI/CD deploy permissions
     ```

  2. **s3-site module:**
     - S3 bucket with versioning enabled
     - Block all public access (serve only via CloudFront OAC)
     - Bucket policy granting CloudFront OAC read access
     - Lifecycle rule for old versions (optional)

  3. **cloudfront module:**
     - Distribution with S3 origin using Origin Access Control (OAC)
     - Default root object: index.html
     - Custom error response: 403/404 → /index.html (SPA routing)
     - HTTPS redirect (viewer-protocol-policy)
     - Optional custom domain aliases + ACM cert ARN
     - Cache policy for static assets

  4. **acm module:**
     - Certificate request with DNS validation
     - Support for domain + wildcard (*.domain.com)
     - Output validation records for manual DNS setup

  5. **iam-deploy module:**
     - IAM user or role for GitHub Actions OIDC
     - Policy: s3:PutObject, s3:DeleteObject on site bucket
     - Policy: cloudfront:CreateInvalidation on distribution
     - Output access credentials or role ARN

  6. **Root main.tf:** Wire all modules together with variable passthrough

  ## Verification
  ```bash
  cd infrastructure/terraform
  terraform init    # (with backend commented out)
  terraform validate
  ```
