description: |
  ## Objective
  Create the three key project metadata files that orient both human developers and AI agents.

  ## Steps
  1. **CLAUDE.md** - Project guidelines modeled after pinpoint's CLAUDE.md:
     - SPOQ methodology reference (audit, discuss, plan with /epic-planning)
     - Build commands: `cd code/site && npm run dev/build/lint`
     - Project structure overview (each top-level directory's purpose)
     - Coding conventions: TypeScript strict, React functional components, Tailwind utility-first
     - Rules: no auto-commits, no auto-push, update journal.md for significant work
     - Common workflows: adding components, updating content, deploying

  2. **journal.md** - Empty template:
     ```markdown
     # Development Journal

     Session entries are recorded below. Archive when exceeding 1500 lines.

     ---
     ```

  3. **README.md** - Project-specific rewrite:
     - Project name and description (Morgan K. Reed technology portfolio)
     - Tech stack summary (React, TypeScript, Vite, Tailwind, shadcn/ui)
     - Prerequisites (Node 20+, npm)
     - Local development: `cd code/site && npm install && npm run dev`
     - Building: `cd code/site && npm run build`
     - Deployment overview (S3 + CloudFront via GitHub Actions)
     - Project structure diagram
     - Documentation pointers (documents/operational/, documents/latex/)

  ## Verification
  - All three files exist at repository root
  - CLAUDE.md references correct paths (code/site/, not src/)
  - README.md contains no Vite template boilerplate
