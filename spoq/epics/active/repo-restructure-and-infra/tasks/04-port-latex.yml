description: |
  ## Objective
  Port the unified LaTeX documentation system from the pinpoint repository so morgankreed has professional document generation capabilities.

  ## Steps
  1. Create directory structure:
     ```
     documents/latex/
     ├── styles/
     ├── templates/
     └── scripts/
     ```
  2. Copy from /Users/admin/Documents/code/pinpoint/documents/latex/:
     - `Makefile.template`
     - `README.md`
     - `scripts/version_manager.py`
     - `styles/doc-premium.sty`, `doc-tables.sty`, `doc-math.sty`, `doc-code.sty`
     - `styles/STYLES.md`, `COLOR_PALETTE.md`, `FONTS.md`
     - `templates/` directory with `registry.yml`
  3. Review doc-premium.sty for any pinpoint-specific branding (colors, logos) and note what would need adapting later (do not change brand colors in this task, just port as-is)
  4. Verify the version manager script works standalone:
     ```bash
     cd documents/latex && python3 scripts/version_manager.py --help
     ```
  5. Write documents/latex/README.md if the ported version references pinpoint-specific paths

  ## Verification
  - `ls documents/latex/styles/*.sty` shows 4 files
  - `python3 documents/latex/scripts/version_manager.py show` (from a test dir with .version file)
