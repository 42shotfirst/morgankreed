description: |
  ## Objective
  Move scattered documentation, system prompts, and stray files into their proper directories following the pinpoint layout convention.

  ## Steps
  1. Create `documents/operational/` directory
  2. Move these files to `documents/operational/`:
     - DEPLOYMENT.md, SERVER_SETUP.md, QUICK_FIX.md
     - EMAIL_ROUTING.md, MEDIA_SECTION_GUIDE.md, TEST_RESULTS.md
  3. Move `system_prompt_chat.txt` and `system_prompt_fit.txt` to `context/`
  4. Move `nordwood-themes-unsplash.jpg` to `code/site/public/images/`
  5. Move `nginx-config.conf` to `infrastructure/` (legacy reference)
  6. Update any internal cross-references between moved docs (if any)

  ## Verification
  - `ls documents/operational/` shows 6 files
  - `ls context/` shows 3 files (template + 2 prompts)
  - Root has no .md files except README.md
