# nginx.conf — used by the root Dockerfile (copied to conf.d/default.conf).
# The web root receives code/site/dist (the Vite build output), never the repo
# root: the repo root has no index.html, which is what left nginx serving its
# stock welcome page.
#
# Port 8080, not 80: the container runs as a non-root user, which cannot bind
# to ports below 1024.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    # Headers are repeated here because a location-level add_header discards
    # the ones inherited from the server block.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
