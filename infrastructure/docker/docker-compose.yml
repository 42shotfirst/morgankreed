name: morgankreed

services:
  site:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.site
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
